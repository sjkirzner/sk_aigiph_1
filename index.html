<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MOUD, Food, and Metabolism</title>
<link rel="icon" href="data:,">
<style>
  /* STEP 1: colour "tokens", defined once. Dark mode redefines the same names. */
  :root {
    --bg: #f3ede0;   /* warm beige page background (light mode) */
    --surface: #ffffff;
    --text: #1d2125;
    --muted: #4f5962;
    --border: #c9cfd4;
    --accent: #0b5cad;
    --warn-bg: #ffefbf;   /* slightly stronger yellow so the disclaimer stands out on beige */
    --warn-border: #b27a00;
    --note-bg: #eef0f3;

    /* EVIDENCE-STRENGTH colours. These carry meaning, so nothing else on the
       page uses them. No green: dark solid = strong, amber = mixed, red = thin
       (caution), dashed grey = needs source. Each also has its own symbol. */
    --strong-bg: #1f2933;  --strong-fg: #ffffff;
    --mixed-bg:  #ffe4a8;  --mixed-fg:  #5a3a00;
    --thin-bg:   #fde8e8;  --thin-fg:   #9b1c1c;
    --none-bg:   #ececec;  --none-fg:   #3b3b3b;

    /* DECORATION colours (blue and green family). Meaning-free: titles,
       headings, hover/selected states, links, and the four layer sections. */
    --blue:   #0b5cad;  --blue-tint:   #e8f1fb;
    --green:  #1a6b35;  --green-tint:  #e6f4ea;
    --teal:   #0b6e6c;  --teal-tint:   #e2f3f2;
    --indigo: #4338ca;  --indigo-tint: #ecedfc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --surface: #1e2227;
      --text: #e8eaed;
      --muted: #aab3bb;
      --border: #3a424a;
      --accent: #7ab6f5;
      --warn-bg: #3a2f10;
      --warn-border: #d9a321;
      --note-bg: #262b31;

      --strong-bg: #e8eaed;  --strong-fg: #14171a;
      --mixed-bg:  #46340a;  --mixed-fg:  #ffd98a;
      --thin-bg:   #4a1717;  --thin-fg:   #ffb4b4;
      --none-bg:   #2a2d31;  --none-fg:   #c3c8cd;

      --blue:   #7ab6f5;  --blue-tint:   #16273a;
      --green:  #7fd49a;  --green-tint:  #15291d;
      --teal:   #5fd6cf;  --teal-tint:   #12292a;
      --indigo: #a9b4ff;  --indigo-tint: #1d2040;
    }
  }

  /* STEP 2: base styles */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 84rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0.5rem 0; color: var(--blue); }
  /* Decorative blue-to-green bar under the page title. */
  h1::after {
    content: ""; display: block; height: 5px; width: min(100%, 14rem);
    margin-top: 0.5rem; border-radius: 3px;
    background: linear-gradient(90deg, var(--blue), var(--green));
  }
  h2 { font-size: 1.25rem; margin: 0 0 0.25rem; color: var(--blue); }
  .muted { color: var(--muted); }
  a { color: var(--blue); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .disclaimer {
    background: var(--warn-bg);
    border: 2px solid var(--warn-border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin: 0 0 1rem;
  }
  .disclaimer strong { display: block; margin-bottom: 0.25rem; }
  .footnote { font-size: 0.85rem; color: var(--muted); margin: -0.5rem 0 1rem; }

  .legend { margin: 0.5rem 0 1rem; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
  .legend li { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }

  /* STEP 3: main grid. Phone first: one column. */
  .drug { margin: 1.5rem 0; }
  .drug-note { color: var(--muted); margin: 0 0 0.75rem; font-size: 0.95rem; }
  .cells { display: grid; gap: 0.75rem; align-items: start; }
  .col-heads { display: none; }

  /* --cols is set by the script from the number of topics in data.json. */
  @media (min-width: 70rem) {
    .layout-row, .col-heads { display: grid; grid-template-columns: 10rem repeat(var(--cols, 4), minmax(0, 1fr)); gap: 0.75rem; align-items: start; }
    .col-heads { font-weight: 700; padding-bottom: 0.25rem; border-bottom: 2px solid var(--blue); color: var(--blue); }
    .col-heads span:first-child { visibility: hidden; }
    .cells { display: contents; }
    .drug { margin: 0.75rem 0; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    /* In the grid the column name is in the header row, so hide it inside the
       cell visually (screen readers still read it). */
    .grid-cell .cell-title {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
  }
  .cell-title { font-weight: 700; display: block; margin-bottom: 0.25rem; }

  /* Extra sections (recovery phase, setting, ...) use a flexible card grid. */
  .layer { margin: 2.5rem 0; }
  /* The four themed sections each get their own accent colour. Decoration
     only: these hues are kept separate from the evidence-strength colours. */
  .layer[data-layer] {
    --accent-layer: var(--blue); --tint: var(--blue-tint);
    background: var(--tint);
    border-left: 6px solid var(--accent-layer);
    border-radius: 8px;
    padding: 1rem;
  }
  .layer[data-layer="recovery_phase"] { --accent-layer: var(--blue);   --tint: var(--blue-tint); }
  .layer[data-layer="setting"]        { --accent-layer: var(--green);  --tint: var(--green-tint); }
  .layer[data-layer="food_access"]    { --accent-layer: var(--teal);   --tint: var(--teal-tint); }
  .layer[data-layer="who_gains_more"] { --accent-layer: var(--indigo); --tint: var(--indigo-tint); }
  .layer[data-layer] h2 { color: var(--accent-layer); }
  .layer-cell .cell-title { color: var(--accent-layer); }
  .grid-cell .cell-title { color: var(--blue); }
  .layer-cells {
    display: grid; gap: 0.75rem; align-items: start; margin-top: 0.75rem;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
  }

  /* STEP 4: one cell. <details> gives free click and keyboard expanding. */
  details.cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  details.cell summary { cursor: pointer; padding: 0.75rem; list-style: none; display: block; }
  details.cell summary::-webkit-details-marker { display: none; }
  details.cell summary::after {
    content: "Show more \25BE";
    display: block; margin-top: 0.5rem; font-size: 0.85rem; color: var(--accent);
  }
  details.cell[open] summary::after { content: "Show less \25B4"; }
  /* Hover and selected (open) states use the section's accent colour. */
  details.cell:hover { border-color: var(--accent-layer, var(--blue)); }
  details.cell[open] {
    border-color: var(--accent-layer, var(--blue));
    box-shadow: inset 5px 0 0 var(--accent-layer, var(--blue));
  }
  .summary-text { display: block; margin-bottom: 0.5rem; }
  .more { padding: 0 0.75rem 0.75rem; border-top: 1px solid var(--border); }
  .more p { margin: 0.75rem 0; }
  .more h4 { margin: 0.75rem 0 0.25rem; font-size: 0.95rem; }
  .more ul, .more ol { margin: 0; padding-left: 1.25rem; }
  .more li { margin-bottom: 0.5rem; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.75rem; margin: 0.75rem 0; font-size: 0.92rem; }
  .facts dt { font-weight: 700; color: var(--muted); }
  .facts dd { margin: 0; }
  .caveat { border-left: 4px solid var(--muted); background: var(--note-bg); padding: 0.5rem 0.75rem; border-radius: 4px; margin: 0.75rem 0; }
  .src-note { display: block; color: var(--muted); font-size: 0.88rem; }
  .no-source { color: var(--muted); font-style: italic; }

  /* Evidence labels: symbol AND words, so meaning never depends on colour alone. */
  .badge {
    display: inline-block; padding: 0.1rem 0.6rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; border: 1px solid currentColor;
  }
  .badge-strong { background: var(--strong-bg); color: var(--strong-fg); border-color: var(--strong-bg); }
  .badge-mixed  { background: var(--mixed-bg);  color: var(--mixed-fg); }
  .badge-thin   { background: var(--thin-bg);   color: var(--thin-fg); border-width: 2px; }
  .badge-needs-source { background: transparent; color: var(--none-fg); border-style: dashed; font-style: italic; }

  /* "Needs source" cells look clearly different: dashed border and hatching. */
  details.cell.ev-needs-source {
    border-style: dashed; border-width: 2px;
    background-image: repeating-linear-gradient(-45deg, transparent 0 8px, var(--none-bg) 8px 10px);
  }
  details.cell.ev-needs-source .summary-text { font-style: italic; color: var(--muted); }

  .status { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .status.error { border-color: var(--warn-border); }
  .status code { background: var(--none-bg); padding: 0.1rem 0.3rem; border-radius: 4px; }
  .plain-list { padding-left: 1.25rem; }
  .plain-list li { margin-bottom: 0.5rem; overflow-wrap: anywhere; }
  footer { margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <!-- Empty scaffolding. The script at the bottom fills it from data.json. -->
  <h1 id="title">Loading…</h1>
  <p class="muted" id="updated"></p>

  <div class="disclaimer" role="note" aria-labelledby="disc-head">
    <strong id="disc-head">Please read first: not medical advice</strong>
    <span id="disclaimer"></span>
  </div>
  <p class="footnote" id="footnote" hidden></p>

  <p>Each box gives a one-sentence summary and an evidence label. Select a box to see details, caveats, and sources.</p>
  <h2>Evidence labels</h2>
  <ul class="legend" id="legend"></ul>

  <div id="status" class="status" role="status">Loading data…</div>

  <div id="content" hidden>
    <div class="col-heads" id="col-heads" aria-hidden="true"></div>
    <div id="rows"></div>
    <div id="layers"></div>

    <section class="layer" id="open-section" aria-labelledby="open-h">
      <h2 id="open-h">Open questions</h2>
      <ul class="plain-list" id="open"></ul>
    </section>
    <section class="layer" id="next-section" aria-labelledby="next-h">
      <h2 id="next-h">To read next</h2>
      <ul class="plain-list" id="next"></ul>
    </section>
    <section class="layer" aria-labelledby="src-h">
      <h2 id="src-h">All sources</h2>
      <ol class="plain-list" id="sources"></ol>
    </section>
  </div>
</main>

<script>
/* STEP 5: JavaScript. It fetches data.json, builds the page, and shows a
   friendly message if something goes wrong. Text is always set with
   textContent (never innerHTML), so nothing in data.json can inject code. */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

// data.json uses "needs_source"; CSS class names use "needs-source".
const cssName = id => id.replace(/_/g, "-");
const SYMBOLS = { "strong": "✓", "mixed": "◐", "thin": "\u25B2", "needs_source": "?" };

let LEVELS = {};    // id -> {label, meaning}
let SOURCES = {};   // id -> source object

function badge(levelId) {
  const level = LEVELS[levelId] || { label: levelId };
  const b = el("span", "badge badge-" + cssName(levelId));
  const sym = el("span", null, (SYMBOLS[levelId] || "") + " ");
  sym.setAttribute("aria-hidden", "true");
  b.append(sym, document.createTextNode(level.label));
  return b;
}

function safeUrl(u) {
  try { const p = new URL(u); return (p.protocol === "https:" || p.protocol === "http:") ? p.href : null; }
  catch (e) { return null; }
}

// One source entry: citation (linked if there is a URL), note, publication type.
function sourceItem(s) {
  const li = el("li");
  const href = s.url ? safeUrl(s.url) : null;
  if (href) {
    const a = el("a", null, s.citation);
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    li.append(a, document.createTextNode(" (opens in a new tab)"));
  } else {
    li.append(document.createTextNode(s.citation), el("span", "src-note", "No link available."));
  }
  const bits = [s.publication_type, s.note].filter(Boolean).join(" — ");
  if (bits) li.append(el("span", "src-note", bits));
  return li;
}

// One expandable cell. `label` is the column name (grid) or title (layers).
function buildCell(label, cell, kind) {
  const d = el("details", "cell " + kind + " ev-" + cssName(cell.strength));
  const summary = el("summary");
  summary.append(el("span", "cell-title", label), el("span", "summary-text", cell.summary), badge(cell.strength));

  const more = el("div", "more");
  more.append(el("p", null, cell.detail));

  const facts = [
    ["Evidence type", cell.evidence_type],
    ["Publication", cell.publication_type],
    ["Population", cell.population],
    ["Duration", cell.duration]
  ].filter(f => f[1]);
  if (facts.length) {
    const dl = el("dl", "facts");
    for (const [k, v] of facts) { dl.append(el("dt", null, k), el("dd", null, v)); }
    more.append(dl);
  }

  if (cell.caveat) {
    const c = el("p", "caveat");
    c.append(el("strong", null, "Caveat: "), document.createTextNode(cell.caveat));
    more.append(c);
  }

  more.append(el("h4", null, "Sources"));
  const ids = cell.sources || [];
  if (ids.length === 0) {
    more.append(el("p", "no-source", "No source yet."));
  } else {
    const ul = el("ul");
    for (const id of ids) {
      const s = SOURCES[id];
      ul.append(s ? sourceItem(s) : el("li", null, id));
    }
    more.append(ul);
  }
  d.append(summary, more);
  return d;
}

function render(data) {
  document.getElementById("title").textContent = data.meta.title;
  document.title = data.meta.title;
  document.getElementById("updated").textContent = "Last updated " + data.meta.last_updated;
  document.getElementById("disclaimer").textContent = data.meta.disclaimer;
  if (data.meta.footnote) {
    const fn = document.getElementById("footnote");
    fn.textContent = data.meta.footnote;
    fn.hidden = false;
  }

  for (const l of data.meta.strength_levels) LEVELS[l.id] = l;
  for (const s of data.sources) SOURCES[s.id] = s;

  // Legend
  const legend = document.getElementById("legend");
  for (const l of data.meta.strength_levels) {
    const li = el("li");
    li.append(badge(l.id), el("span", "muted", l.meaning));
    legend.append(li);
  }

  // Tell the CSS how many topic columns there are.
  document.documentElement.style.setProperty("--cols", data.topics.length);

  // Column headings (desktop only; hidden from screen readers because every
  // cell carries its own label).
  const heads = document.getElementById("col-heads");
  heads.append(el("span", null, "Medication"));
  for (const t of data.topics) heads.append(el("span", null, t.name));

  // Rows = medications, columns = topics. Find each cell by medication + topic.
  const rows = document.getElementById("rows");
  for (const med of data.medications) {
    const section = el("section", "drug");
    section.setAttribute("aria-labelledby", "h-" + med.id);
    const layout = el("div", "layout-row");

    const head = el("div");
    const h = el("h2", null, med.name);
    h.id = "h-" + med.id;
    head.append(h, el("p", "drug-note", med.note));

    const cells = el("div", "cells");
    for (const t of data.topics) {
      const cell = data.cells.find(c => c.medication === med.id && c.topic === t.id);
      if (cell) {
        cells.append(buildCell(t.name, cell, "grid-cell"));
      } else {
        cells.append(buildCell(t.name, { summary: "No entry yet.", detail: "This cell has no data.", strength: "needs_source", sources: [] }, "grid-cell"));
      }
    }
    layout.append(head, cells);
    section.append(layout);
    rows.append(section);
  }

  // Extra sections
  const layers = document.getElementById("layers");
  for (const layer of data.layers) {
    const section = el("section", "layer");
    section.setAttribute("aria-labelledby", "l-" + layer.id);
    section.dataset.layer = layer.id;   // lets the CSS give each section its own accent
    const h = el("h2", null, layer.title);
    h.id = "l-" + layer.id;
    const wrap = el("div", "layer-cells");
    for (const c of layer.cells) wrap.append(buildCell(c.title, c, "layer-cell"));
    section.append(h, el("p", "muted", layer.description), wrap);
    layers.append(section);
  }

  // Lists at the bottom
  const fill = (id, items) => {
    const ul = document.getElementById(id);
    for (const t of items) ul.append(el("li", null, t));
  };
  fill("open", data.open_questions);
  fill("next", data.to_read_next);
  const all = document.getElementById("sources");
  for (const s of data.sources) all.append(sourceItem(s));

  document.getElementById("status").hidden = true;
  document.getElementById("content").hidden = false;
}

fetch("data.json")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(err => {
    const s = document.getElementById("status");
    s.classList.add("error");
    s.replaceChildren(
      el("p", null, "Could not load or read data.json (" + err.message + ")."),
      el("p", null, "If you opened this file by double-clicking it, browsers block fetch() on local files. Start a tiny local server in this folder, then open http://localhost:8000"),
      el("code", null, "python3 -m http.server 8000")
    );
  });
</script>
</body>
</html>
